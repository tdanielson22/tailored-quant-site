<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520">
  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500&amp;family=Cormorant+Garamond:wght@500&amp;display=swap");</style></defs>
  <rect width="640" height="520" fill="#FFFFFF"/>
  <g fill="none" stroke="#111111" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- t stem curves down, becomes the left wall of the q bowl, loops right and back over the top -->
    <path d="M170 56
             C146 120 142 220 148 284
             A56 56 0 0 0 260 284
             A56 56 0 0 0 158 244"/>
    <!-- q descender drops from the bowl's right side -->
    <path d="M260 284 C262 336 262 386 262 436 Q262 476 302 458 L326 444"/>
    <!-- t crossbar -->
    <path d="M86 148 H222"/>
  </g>
  <g font-family="Fira Sans, sans-serif" font-size="80" font-weight="500" fill="#111111" letter-spacing="1">
    <text x="292" y="262">ailored</text>
    <text x="292" y="352">uant</text>
  </g>
  <!-- tagline: spans from the q descender to the end of "tailored" -->
  <text x="276" y="400" textLength="268" lengthAdjust="spacing"
        font-family="Cormorant Garamond, Garamond, Georgia, serif" font-size="21" font-weight="500"
        fill="#7A7A7A" letter-spacing="2">INVESTMENT RISK ADVISORY</text>
</svg>
